<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forecast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <main class="shell">
    <header class="hero">
      <p class="brand">Forecast</p>
      <h1 class="tagline">Run commission statement forecasts without the terminal.</h1>
      <p class="lede">Choose an agency, refresh the file list, multi-select statements by name, then run.</p>
    </header>

    <section class="run-panel" aria-label="Run controls">
      <form id="run-form">
        <div class="field-row">
          <label class="field">
            <span class="label">Environment</span>
            <div class="segmented" role="group" aria-label="Environment">
              <button type="button" class="seg active" data-env="prod">Prod</button>
              <button type="button" class="seg" data-env="preprod">Preprod</button>
            </div>
            <input type="hidden" name="env" id="env" value="prod" />
          </label>

          <label class="field">
            <span class="label">Mode</span>
            <div class="segmented" role="group" aria-label="Mode">
              <button type="button" class="seg active" data-mode="files">Select files</button>
              <button type="button" class="seg" data-mode="review">All Review</button>
            </div>
            <input type="hidden" name="mode" id="mode" value="files" />
          </label>
        </div>

        <div class="field-row agency-row">
          <label class="field">
            <span class="label">Agency ID</span>
            <input id="agency_id" name="agency_id" type="number" min="1" step="1" placeholder="e.g. 5" required />
          </label>
          <div class="field file-actions-field" id="file-actions">
            <span class="label">Statement files</span>
            <div class="file-actions">
              <button type="button" class="btn ghost" id="refresh-files">Refresh files</button>
              <label class="check-inline">
                <input type="checkbox" id="review-only" checked />
                Review only
              </label>
            </div>
          </div>
        </div>

        <div class="field" id="files-field">
          <div class="files-toolbar">
            <input type="search" id="file-filter" placeholder="Filter by file name…" autocomplete="off" />
            <div class="files-toolbar-actions">
              <button type="button" class="btn tiny" id="select-all">Select all</button>
              <button type="button" class="btn tiny" id="clear-selection">Clear</button>
              <span class="selection-count" id="selection-count">0 selected</span>
            </div>
          </div>
          <div id="file-list" class="file-list" role="group" aria-label="Statement files">
            <p class="empty-note" id="files-empty">Enter an agency ID and click Refresh files.</p>
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="btn primary" id="run-btn">Run Forecast</button>
          <button type="button" class="btn ghost" id="stop-btn" disabled>Stop</button>
          <p class="status-line" id="status-line" aria-live="polite">Ready</p>
        </div>
      </form>
    </section>

    <section class="log-panel" aria-label="Live log">
      <div class="panel-head">
        <h2>Live log</h2>
        <button type="button" class="btn tiny" id="clear-log">Clear</button>
      </div>
      <pre id="log" class="log" tabindex="0"></pre>
    </section>

    <section class="results-panel" aria-label="Recent outputs">
      <div class="panel-head">
        <h2>Excel outputs</h2>
        <button type="button" class="btn tiny" id="refresh-outputs">Refresh</button>
      </div>
      <div id="root-files" class="file-strip"></div>
      <div id="runs" class="runs"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
